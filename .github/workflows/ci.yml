name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore VagabondK.OpenType.slnx

      - name: Build
        run: dotnet build VagabondK.OpenType.slnx -c Release --no-restore

      - name: Test
        run: dotnet test VagabondK.OpenType.Tests -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx

  font-validation:
    name: Validate generated fonts (fontTools)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install fontTools
        run: pip install fonttools

      - name: Generate sample fonts
        run: |
          dotnet run --project SimpleFontSample -c Release
          dotnet run --project SevenSegmentSample -c Release

      - name: Validate fonts
        run: |
          cat > validate_fonts.py <<'PY'
          import glob, sys
          from fontTools.ttLib import TTFont
          files = sorted(glob.glob("SimpleFontSample/bin/Release/net*/**/*.otf", recursive=True)
                       + glob.glob("SimpleFontSample/bin/Release/net*/**/*.ttf", recursive=True)
                       + glob.glob("SevenSegmentSample/bin/Release/net*/**/*.otf", recursive=True)
                       + glob.glob("SevenSegmentSample/bin/Release/net*/**/*.ttf", recursive=True))
          if not files:
              print("No font files generated"); sys.exit(1)
          ok = True
          for p in files:
              try:
                  f = TTFont(p)
                  f.compile()
                  f.close()
                  print("OK", p)
              except Exception as e:
                  ok = False
                  print("FAIL", p, type(e).__name__, e)
          sys.exit(0 if ok else 1)
          PY
          python validate_fonts.py
